// evita repetir el orden de preguntas en rondas seguidas
let ultimoOrden = [];
let responder = false;

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function nuevaRonda(){
  let idx = [...Array(BANCO.length).keys()];
  do{ idx = shuffle(idx); }while(idx.join()===ultimoOrden.join() && ultimoOrden.length>0);
  ultimoOrden = idx.slice();
  const sel = idx.slice(0,10); // 10 preguntas al azar
  const preguntas = BANCO.filter((_,i)=>sel.includes(i)).map(q=>({...q}));

  // mezclar opciones conservando la posición de la correcta
  preguntas.forEach(q=>{
    const optIndex = q.o.map((_,i)=>i);
    shuffle(optIndex);
    q.o = optIndex.map(i=>q.o[i]);
    q.a = optIndex.indexOf(q.a);
  });

  const main = document.getElementById("main");
  main.innerHTML = "";
  preguntas.forEach((q,pos)=>{
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.answer = q.a;
    card.dataset.correcta = q.o[q.a];
    let optsHtml = "";
    q.o.forEach((op,i)=>{
      optsHtml += `<label class="opt"><input type="radio" name="q${pos}" value="${i}">`+
                  `<span class="opt-label">${op}</span></label>`;
    });
    card.innerHTML = `<span class="q-num">Pregunta ${pos+1} de ${preguntas.length}</span>`+
      `<div class="q-text">${q.p}</div>`+
      `<div class="opts">${optsHtml}</div>`+
      `<div class="feedback"></div>`;
    card.querySelectorAll('.opt').forEach(lbl=>{
      lbl.addEventListener('click',()=>marcarSeleccion(card,lbl));
    });
    main.appendChild(card);
  });
  responder = true;
  const c = document.querySelectorAll('.card');
  document.getElementById("puntaje").textContent=`Mostrar: ${c.length} preguntas · Respondidas: 0`;
  document.getElementById("resumenFinal").style.display="none";
}

function marcarSeleccion(card,lbl){
  card.querySelectorAll('.opt').forEach(o=>o.classList.remove('seleccionada'));
  lbl.classList.add('seleccionada');
  lbl.querySelector('input').checked = true;
  card.querySelector('.feedback').className='feedback';
  card.querySelector('.feedback').innerHTML='';
}

function corregir(){
  if(!responder) return;
  const cards = document.querySelectorAll('.card');
  let ok=0, mal=0;
  cards.forEach(card=>{
    const checked = card.querySelector('input:checked');
    const fb = card.querySelector('.feedback');
    if(!checked){
      fb.className='feedback mal';
      fb.innerHTML=`Sin respuesta. La correcta es: <span class="res-correcta">${card.dataset.correcta}</span>`;
      mal++;
      return;
    }
    const correcto = parseInt(checked.value)===parseInt(card.dataset.answer);
    if(correcto){
      ok++;
      card.querySelectorAll('.opt').forEach(o=>o.style.borderColor='#a5d6a7');
      checked.closest('.opt').style.background='#e8f5e9';
      fb.className='feedback ok';
      fb.innerHTML='✓ Correcto';
    }else{
      mal++;
      checked.closest('.opt').style.background='#ffebee';
      checked.closest('.opt').style.borderColor='#ef9a9a';
      card.querySelectorAll('.opt input').forEach(inp=>{
        if(parseInt(inp.value)===parseInt(card.dataset.answer)){
          inp.closest('.opt').style.background='#e8f5e9';
          inp.closest('.opt').style.borderColor='#a5d6a7';
        }
      });
      fb.className='feedback mal';
      fb.innerHTML=`✗ Incorrecto. La correcta es: <span class="res-correcta">${card.dataset.correcta}</span>`;
    }
    card.querySelectorAll('.opt input').forEach(i=>i.disabled=true);
  });
  responder=false;
  const total=cards.length;
  document.getElementById("rTotales").textContent=total;
  document.getElementById("rOk").textContent=ok;
  document.getElementById("rMal").textContent=mal;
  const nota=(ok/total*10).toFixed(1);
  const n=document.getElementById("rNota");
  n.textContent=nota+" / 10";
  n.className="nota "+(nota>=8?'nota-alta':nota>=5?'nota-media':'nota-baja');
  document.getElementById("rMensaje").textContent =
    nota>=8?"¡Muy bien! Dominás la unidad.":
    nota>=5?"Vas bien, repasá los conceptos que fallaron.":
    "Repasá la unidad 2 y volvé a intentarlo.";
  document.getElementById("resumenFinal").style.display="block";
  document.getElementById("resumenFinal").scrollIntoView({behavior:'smooth'});
  actualizarPuntaje();
}

function actualizarPuntaje(){
  const cards=document.querySelectorAll('.card');
  const contestadas=cards.length
    ? [...cards].filter(c=>c.querySelector('input:checked')||c.querySelector('.feedback').className.includes('mal')).length
    : 0;
  document.getElementById("puntaje").textContent=
    `Mostrar: ${cards.length} preguntas · Respondidas: ${contestadas}`;
}

document.getElementById("btnShuffle").addEventListener("click",nuevaRonda);
document.getElementById("btnEvaluar").addEventListener("click",corregir);
document.getElementById("btnReintentar").addEventListener("click",()=>{
  const cards=document.querySelectorAll('.card');
  cards.forEach(card=>{
    card.querySelectorAll('input').forEach(i=>{i.checked=false; i.disabled=false;});
    card.querySelectorAll('.opt').forEach(o=>{o.classList.remove('seleccionada'); o.style.background=''; o.style.borderColor='';});
    card.querySelector('.feedback').className='feedback';
    card.querySelector('.feedback').innerHTML='';
  });
  responder=true;
  document.getElementById("resumenFinal").style.display="none";
  actualizarPuntaje();
  window.scrollTo({top:0,behavior:'smooth'});
});

nuevaRonda();
</script>
